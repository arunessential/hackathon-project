<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudWatch Lite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 10px;
      border-radius: 10px;
      display: inline-block;
      width: 30%;
    }

    button {
      background: #3b82f6;
      border: none;
      padding: 10px;
      color: white;
      cursor: pointer;
    }

    input {
      padding: 10px;
      width: 60%;
    }
  </style>
</head>

<body>

<header>🚀 CloudWatch Lite Dashboard</header>

<div class="container">

  <h2>Add Website</h2>
  <input type="text" id="url" placeholder="Enter URL">
  <button onclick="addSite()">Monitor</button>

  <h2>Status</h2>
  <div id="results"></div>

</div>

<script>
async function addSite() {
  let url = document.getElementById("url").value;

if (!url.startsWith("http")) {
  url = "https://" + url;
}

  console.log("Clicked!", url);

  try {
    const res = await fetch("http://127.0.0.1:3000/check", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ url })
    });

    const data = await res.json();
    console.log("Response:", data);

    document.getElementById("results").innerHTML += `
      <div class="card">
        <h3>${url}</h3>
        <p>Status: ${data.status}</p>
        <p>Time: ${data.time} ms</p>
      </div>
    `;
  } catch (err) {
    console.error("Error:", err);
  }
}
</script>

</body>
</html>
