<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CloudWatch Lite</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #0b1220;
  color: #e5e7eb;
  margin: 0;
}

header {
  background: #111827;
  padding: 16px 30px;
  display: flex;
  justify-content: space-between;
}

.container {
  padding: 30px;
}

.input-box {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

.input-box input {
  flex: 1;
  padding: 14px;
  border-radius: 8px;
  background: #111827;
  color: white;
  border: 1px solid #1f2937;
}

.input-box button {
  padding: 14px 20px;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  border: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #1f2937;
}

.status.up { color: #22c55e; }
.status.down { color: #ef4444; }
.status.warn { color: #f59e0b; }
</style>
</head>

<body>

<script>
// 🔐 AUTH CHECK
const token = localStorage.getItem("token");
if (!token) {
  window.location.href = "login.html";
}
</script>

<header>
  <h2>CloudWatch Lite</h2>
  <span>⚡ Real-time Monitoring</span>
</header>

<div class="container">

  <!-- INPUT -->
  <div class="input-box">
    <input id="url" placeholder="Enter website (e.g. google.com)">
    <button onclick="addWebsite()">Monitor</button>
  </div>

  <!-- CARDS -->
  <div class="grid" id="dashboard"></div>

</div>

<script>
const BASE_URL = "http://3.236.191.132:5000";

// ➕ ADD WEBSITE
async function addWebsite() {
  let url = document.getElementById("url").value;

  if (!url) return;

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  try {
    const res = await fetch(BASE_URL + "/add-website", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": token
      },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    if (data.success) {
      alert("✅ Website added successfully");
      loadDashboard(); // refresh UI
    } else {
      alert("❌ Failed");
    }

  } catch (err) {
    console.error(err);
    alert("❌ Error");
  }
}

// 📊 LOAD DASHBOARD
async function loadDashboard() {
  try {
    const res = await fetch(BASE_URL + "/status");
    const data = await res.json();

    const container = document.getElementById("dashboard");
    container.innerHTML = "";

    data.forEach(site => {
      let statusClass = "down";
      let statusText = "Failed";

      if (site.status == 200) {
        statusClass = "up";
        statusText = "Healthy";
      } else if (site.status === "DNS_FAIL") {
        statusClass = "warn";
        statusText = "DNS Error";
      }

      container.innerHTML += `
        <div class="card">
          <h3>${site.url}</h3>
          <p class="status ${statusClass}">● ${statusText}</p>
          <p>Response Time: ${site.response_time || 0} ms</p>
        </div>
      `;
    });

  } catch (err) {
    console.error("Dashboard error:", err);
  }
}

// 🔄 AUTO REFRESH
setInterval(loadDashboard, 5000);
loadDashboard();
</script>

</body>
</html>
