name: Deploy App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build images
        run: |
          echo "Project strucutre:"
          ls -R
          
          docker build -t frontend -f Docker/Dockerfile.frontend .
          docker build -t backend -f Docker/Dockerfile.backend .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      
      - name: SSH Deploy
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            if [ ! -d "hackathon-project" ]; then
              git clone https://github.com/arunessential/hackathon-project.git
            fi

            cd hackathon-project
            git pull origin main

            /usr/bin/docker-compose -f Docker/docker-compose.yml down || true
            /usr/bin/docker-compose -f Docker/docker-compose.yml up -d --build
           EOF
           
      


        
